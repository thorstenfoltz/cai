# skip-path only filters directory scans. On pull requests MegaLinter passes
# the changed files to checkov with --file, which ignores skip-path, so
# workflow findings must be suppressed per check instead.
# CKV_GHA_7: workflow_dispatch inputs must be empty; release_aur.yml needs a
# manual version input to republish a release.
skip-check:
  - CKV_GHA_7
